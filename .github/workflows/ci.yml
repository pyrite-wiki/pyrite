name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # GitHub's merge queue. Without this trigger the queue cannot be enabled at
  # all: a queued PR waits on the required check (`gate`) and a workflow that
  # does not run on merge_group never produces one (#273). The queue is what
  # ends the O(N^2) drain the `dev` ruleset's "up to date" requirement imposes
  # -- one docs-only merge put all 12 open PRs BEHIND on 2026-09-21.
  merge_group:
  workflow_dispatch:

# Least privilege by default: checkout only. Any job that needs more says so
# in its own permissions: block, with a one-line comment naming which step
# needs it (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# On a pull-request branch a newer push makes the older run's answer
# irrelevant. CI is the gate (the full suite no longer runs at commit time --
# see .pre-commit-config.yaml), so it has to answer quickly rather than queue
# behind superseded runs.
#
# On `dev` and `main` it is NOT irrelevant. Every PR rebases onto `dev`, and
# `main` only ever fast-forwards to a commit CI has proven, so each commit
# there is something other work depends on having been verified. Keyed on the
# ref alone, a second merge cancels the first one's matrix: on 2026-09-21 #173
# merged seven minutes after #276 and killed its run, leaving 38beda9 -- the
# commit that changed the release path -- with no verdict and a red `gate`
# that meant only "superseded" (#279). A break introduced there and masked by
# the next commit is invisible, because the later run covers the accumulated
# code rather than each commit; and red-that-means-nothing teaches people to
# ignore red.
#
# `github.ref_protected` is true for `dev` and `main` (both carry rulesets),
# so those get the SHA in the group key -- one group per commit, nothing
# cancelled. Everything else keeps the old behaviour. The merge queue makes
# this more likely, not less: it lands PRs in quick succession, which is
# exactly the pattern that triggered it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref_protected && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Change classifier. A required check cannot be path-filtered out of the
  # workflow (GitHub leaves it "pending" forever), so the workflow always
  # runs, this job classifies the change, and the heavy jobs skip when nothing
  # they test has changed. A skipped job satisfies a required check, so a
  # docs- or KB-only PR is green in about a minute. main always runs
  # everything: it only moves to a SHA this workflow has proven.
  # ===========================================================================
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter reads the PR's changed-files list on pull_request
    # events, which needs pull-requests: read beyond the workflow default.
    # The `queue` step lists this workflow's merge_group runs: actions: read.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    # Each output reads the fallback FIRST, then the filter. Exactly one of the
    # two steps runs per event, and a skipped step's outputs are the empty
    # string -- which `== 'true'` reads as "not changed", i.e. skip. Listing
    # both with `||` is what makes a merge group classify as everything-changed
    # instead of falling off the end into a silent all-skip (#273).
    outputs:
      backend: ${{ steps.all.outputs.backend || steps.filter.outputs.backend }}
      web: ${{ steps.all.outputs.web || steps.filter.outputs.web }}
      kb: ${{ steps.all.outputs.kb || steps.filter.outputs.kb }}
      infra: ${{ steps.all.outputs.infra || steps.filter.outputs.infra }}
      queue_passed: ${{ steps.all.outputs.queue_passed || steps.queue.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # FAIL CLOSED on a merge group. dorny/paths-filter reads the PR's
      # changed-file list only for the events in its own `prEvents` list
      # (pull_request, pull_request_target, pull_request_review,
      # pull_request_review_comment). merge_group is NOT one of them
      # (dorny/paths-filter#280), so there it falls through to
      # getChangedFilesFromGit(base, ref) with `base` unset -- which resolves
      # to the repository's default_branch (`dev`) and diffs the
      # gh-readonly-queue/... ref against it over a fetch-depth: 1 checkout
      # that does not contain that history. That path either errors or yields
      # an arbitrary classification.
      #
      # Either way the downstream shape is the same and it is the dangerous
      # one: every heavy job is `if: needs.changes.outputs.<x> == 'true'`, a
      # SKIPPED job satisfies a required check, and `gate` is `if: always()`
      # failing only on failure|cancelled. So an all-false classification
      # skips the whole matrix and reports the one required check GREEN having
      # tested nothing -- strictly worse than having no merge queue.
      #
      # So we do not ask the action. A merge group is classified here, as
      # everything-changed, so every gated job runs. (Which interpreters the
      # `test` job then uses is a separate decision -- see its matrix
      # comment; a queued group takes the narrow one.) Running too much for a
      # queued commit costs one runner; running nothing and calling it green
      # merges untested code to dev.
      - id: all
        if: github.event_name == 'merge_group'
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "web=true" >> "$GITHUB_OUTPUT"
          echo "kb=true" >> "$GITHUB_OUTPUT"
          echo "infra=true" >> "$GITHUB_OUTPUT"
          echo "queue_passed=false" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Each commit is tested once. The merge queue runs the full matrix and
      # the frontend on the exact commit that then lands on dev -- the queue
      # run's head_sha IS the dev push's SHA (checked on 2026-09-25: 85c7c123,
      # 0a66cd4c, 65a4ab22, d787e875 each had a successful merge_group run,
      # concluded 11-26 s before the push run started). Running `test` and
      # `frontend` again on the push re-tested code with exactly those tests
      # already passed against it. So on a push to dev, a successful
      # merge_group run of this workflow for this SHA skips both; `smoke` runs
      # (the queue does not), and `gate` reads the skips as it always has.
      # Anything else -- no queue run, one still running, a failed one, an API
      # error, a direct push -- runs everything as before. main and
      # workflow_dispatch never skip: the step does not run for them.
      # -----------------------------------------------------------------------
      - id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$GITHUB_SHA&status=success" \
                --jq "[.workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .conclusion == \"success\")] | length" \
              || echo 0)
          if [ "${n:-0}" -gt 0 ] 2>/dev/null; then
            echo "merge queue already passed $GITHUB_SHA; skipping test and frontend"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no successful merge_group run for $GITHUB_SHA; running everything"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'pyrite/**'
              - 'extensions/**'
              - 'tests/**'
              - 'conftest.py'
              - 'pyproject.toml'
              - 'kb/kb.yaml'
              - '.pre-commit-config.yaml'
              - '.github/workflows/**'
              - 'scripts/**'
            web:
              - 'web/**'
              - '.github/workflows/**'
            kb:
              - 'kb/**'
            # A change here is a property of the INTERPRETER and pytest
            # version, not of the project's own logic -- a single-interpreter
            # PR gate cannot see it (#133: PR #81's @classmethod fixtures
            # registered and passed on 3.12, the gate's only interpreter, and
            # silently failed to register at all on 3.13, going undetected
            # until the post-merge push to dev ran the full matrix). Widens
            # the `test` job's matrix to match; see that job's `matrix:`.
            infra:
              - 'tests/conftest.py'
              - 'tests/**/conftest.py'
              - 'pyproject.toml'
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/*.sh'
              - 'scripts/*.py'
              # The experimental mapping and the root conftest that applies
              # it decide which tests the gate runs (#657).
              - 'conftest.py'
              - 'tests/experimental_surface.py'

  # Fast check for KB-only changes: schema validation, seconds.
  kb:
    needs: changes
    if: needs.changes.outputs.kb == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: |
          uv pip install --system -e ".[cli]"
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then uv pip install --system -e "$ext"; fi
          done
      - name: Validate KB entries
        run: pyrite schema validate kb/

  test:
    needs: changes
    if: (needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main') && needs.changes.outputs.queue_passed != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Value chain (ADR-0032 §3): a pull request proves the change on one
        # interpreter, fast; the merge queue and the push to dev that follows
        # prove breadth (every supported Python, Postgres). main only
        # fast-forwards to a commit dev already proved. Each step costs more
        # only where it tells us something the previous one could not.
        #
        # Exception (#133): a PR that touches test infrastructure -- fixture
        # declarations, collection hooks, pytest config, the hooks/CI that
        # enforce them -- gets the full matrix too. That class of change is a
        # property of the interpreter and pytest version, not of the
        # project's logic, so the one-interpreter gate cannot see it; #81
        # merged green on 3.12 and reddened dev on 3.13 two minutes later.
        #
        # A merge group used to be narrow too (maintainer, 2026-09-21: "narrow
        # it for now, it is easy to add back later if we have matrix
        # failures"). #388 is exactly that case: it passed PR CI and the
        # (narrow) merge queue on 3.12, then reddened dev's post-merge matrix
        # on 3.13 -- `Path.resolve()` no longer raises on a symlink loop in
        # non-strict mode -- and dev stayed red for about an hour, blocking a
        # release cut (#400, maintainer approved 2026-09-25). The queue runs
        # the exact commit that is about to land, so as of #400 it pays for
        # the full matrix: queue runner minutes, not wall time, since the
        # legs run in parallel. Only `pull_request` stays narrow.
        python-version: ${{ fromJSON((github.event_name == 'pull_request' && needs.changes.outputs.infra != 'true') && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}

    # pgvector/pgvector ships the postgres server with the pgvector
    # extension pre-installed (plain postgres:* images don't have it, and
    # PostgresBackend.ensure_schema() runs `CREATE EXTENSION vector`).
    # Without this service, all 71 postgres conformance test params skip
    # via PYRITE_TEST_PG_URL being unset -- CI never exercises the
    # postgres backend at all (ci-make-green-and-load-bearing item 3).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyrite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 -- the fix-commit-has-tests step below walks
          # base.sha..head over the PR's own commit range; the default shallow
          # checkout doesn't have base.sha's history to diff against.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        # pip took 80-130 s per job to resolve and build seven editable
        # installs even with a warm wheel cache; uv does it in seconds, and it
        # is the install path the README documents (`uv tool install`).
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            extensions/*/pyproject.toml

      - name: Install dependencies
        # `.[dev]` is test TOOLING ONLY (pytest/mypy/ruff/xdist) -- it pulls
        # neither typer/rich (the `cli` extra) nor bcrypt/fastapi (`server`),
        # and the core `dependencies` block doesn't either. Installing just
        # [dev,postgres] left 70 test modules failing at COLLECTION with
        # ModuleNotFoundError (typer, bcrypt) on all three Python versions,
        # while pip still exited 0 so the install step reported success.
        # `.[all]` is the whole optional surface (API, MCP, CLI, AI).
        run: |
          uv pip install --system -e ".[all,postgres]"
          # Extensions are separate distributions, covered by NO pyrite extra.
          # Without this loop 37 test modules fail at collection with
          # ModuleNotFoundError (pyrite_journalism_investigation,
          # pyrite_cascade, pyrite_encyclopedia). With [all] plus this loop the
          # matrix job collects the full suite, which is why the old
          # `test-optional-deps` job (same install, 3.12 only) was removed as a
          # pure duplicate.
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              uv pip install --system -e "$ext"
            fi
          done

      - name: Lint with ruff
        # extensions/ included: the commit-stage ruff hook already lints it
        # (`.pre-commit-config.yaml`), so a PR that skipped extensions/ here
        # could go green with lint debt a local commit would have blocked
        # (hit 2026-09-17: two journalism-investigation files needed
        # reformatting to land an unrelated three-line fix).
        run: |
          ruff check pyrite/ tests/ extensions/
          ruff format --check pyrite/ tests/ extensions/

      # The local commit hooks, re-run here: outside contributors' PRs never
      # run local hooks, and hooks can be skipped with --no-verify. CI can't.
      - name: Check for circular imports
        run: python scripts/check_import_cycles.py

      - name: Validate KB entries
        run: pyrite schema validate kb/

      # Same reasoning as the two checks above: check_fix_commit_has_tests.py
      # only ran as a local commit-msg hook, so outside contributors' PRs
      # (which never run local hooks) could land a `fix:` commit with zero
      # test lines -- all three outside PRs so far did exactly that. `push`
      # events have no PR to diff against (base.sha is unset there), so this
      # only runs on pull_request; fetch-depth: 0 above makes base.sha walkable.
      # --range walks each commit individually (not the range's cumulative
      # diff), so an earlier offending commit isn't hidden by a later,
      # unrelated commit that happens to touch tests/.
      - name: "Check fix: commits have tests (pull_request only)"
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_fix_commit_has_tests.py --range
          ${{ github.event.pull_request.base.sha }} ${{ github.sha }}

      # Advisory, never blocking (#278). #173 merged with its entry appended to
      # CHANGELOG.md under the already-released 0.24.3 heading, so the
      # [Unreleased] invariant test had nothing to catch and the fix was absent
      # from the assembled release notes. This prints a warning annotation when
      # a PR touches pyrite/ or extensions/ and records no fragment.
      #
      # It warns rather than fails on purpose: whether a change is
      # user-visible is the author's judgement, and a blocking check that
      # newcomers hit on their first PR is the friction #276 set out to remove
      # (maintainer, 2026-09-22). `Changelog: none` in the PR body opts out.
      - name: Warn if no changelog fragment (pull_request only, advisory)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          python scripts/check_changelog_fragment.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --body-file /tmp/pr-body.txt

      - name: Type check with mypy
        continue-on-error: true
        run: mypy pyrite/ --ignore-missing-imports

      - name: Run tests
        # A bare `-W error::DeprecationWarning` promotes THIRD-PARTY
        # deprecations to hard errors, so any upstream release can turn CI
        # red without a line of pyrite changing (observed: anyio's
        # `anyio.abc.BlockingPortal` alias warning failing collection).
        # Scope the escalation to pyrite's own modules; everything else
        # stays a visible warning.
        # -n auto: ~2.5x faster on the 4-vCPU runners (22 -> ~10 min), and
        # ADR-0032's "up to date" requirement only works when CI is fast. Tests
        # that are unsafe under xdist are the bug (see
        # tests/test_task_claim_concurrency.py for the pattern: barrier + one
        # group deadline), not a reason to go serial.
        #
        # Coverage on the pull request's 3.12 leg only, for diff coverage
        # below (advisory). COVERAGE_CORE=sysmon is 3.12's low-overhead
        # tracer; --cov-fail-under=0 because [tool.coverage.report] fail_under
        # would otherwise fail this step, and with it `gate`. Every other leg
        # and every push runs without it.
        #
        # The core only (#657): tests of experimental surfaces carry the
        # `experimental` marker (tests/experimental_surface.py) and run in the
        # `experimental` job, which `gate` does not need. The -m here replaces
        # pyproject's addopts -m, so it restates "not slow and not e2e".
        env:
          PYRITE_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/pyrite_test
          COVER: ${{ github.event_name == 'pull_request' && matrix.python-version == '3.12' }}
          COVERAGE_CORE: sysmon
        run: |
          cov=()
          if [ "$COVER" = true ]; then
            cov=(--cov=pyrite --cov-report=xml --cov-fail-under=0)
            for d in extensions/*/src/*/; do cov+=("--cov=$d"); done
          fi
          pytest -n auto -m "not slow and not e2e and not experimental" \
            -W "error::DeprecationWarning:pyrite" \
            -W "error::DeprecationWarning:tests" \
            ${cov[@]+"${cov[@]}"}

      # Diff coverage (the 0.26 test-evidence item): are the lines this PR
      # changes run by some test? ADVISORY -- continue-on-error, so a low
      # number never fails this job or `gate`. The table of uncovered changed
      # lines goes to the step summary; the JSON goes to the verify-red job,
      # which files it with the verdicts for the gate decision after ~10 PRs.
      - name: Diff coverage (pull_request, advisory)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.python-version == '3.12' }}
        continue-on-error: true
        run: |
          status=0
          diff-cover coverage.xml --compare-branch=${{ github.event.pull_request.base.sha }} \
            --fail-under=80 --format json:diff-cover.json,markdown:diff-cover.md || status=$?
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then
            echo "::warning title=diff coverage::below 80% of changed lines (advisory; see the summary)"
          fi

      - name: Keep the diff coverage for verify-red
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.python-version == '3.12' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover
          path: diff-cover.json
          if-no-files-found: ignore
          retention-days: 1

  # ===========================================================================
  # Coverage: its own job so the matrix stays the fast gate. Not a required
  # check. A --cov-fail-under ratchet is added once the baseline is known.
  # ===========================================================================
  coverage:
    # Manual only for now: not a required check, nobody reads the report yet,
    # and it cost a 4 min runner per code PR. Turn back on (with a
    # --cov-fail-under ratchet) when there is a baseline worth holding.
    needs: changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            extensions/*/pyproject.toml
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[all]"
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then uv pip install --system -e "$ext"; fi
          done
      - name: Run tests with coverage
        run: pytest -n auto --cov=pyrite --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ===========================================================================
  # Frontend: unit tests + svelte-check + build. Fast (~1 min); runs in
  # parallel with backend. r1900 web-tests-in-ci.
  # ===========================================================================
  frontend:
    needs: changes
    if: (needs.changes.outputs.web == 'true' || github.ref == 'refs/heads/main') && needs.changes.outputs.queue_passed != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  # ===========================================================================
  # E2E: Playwright against a real backend. Slower (~5-8 min) so it runs in
  # its own job — a unit-test failure shouldn't block the E2E signal and
  # vice versa. r1900 web-tests-in-ci.
  # ===========================================================================
  e2e:
    # Manual only (Actions -> CI -> Run workflow) until the suite is
    # deterministic (playwright-e2e-suite-non-deterministic-failures-...). It
    # fails a different set of specs every run, so it carries no signal; on
    # every push it cost 7 min of runner time, and on main it flagged every
    # release as failed. The job is kept so restoring it is a one-line change.
    needs: changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TEMPORARILY NON-BLOCKING (2026-09-16). The suite is non-deterministic:
    # it fails a different set of specs on every run, same code, same machine
    # (strict-mode violations like `locator('text=New Entry') resolved to 2
    # elements`, plus order-dependent empty-state assertions). It is not
    # detecting regressions; it is emitting noise.
    #
    # While it blocks, NO commit can ever produce a green CI run -- the
    # "permanently-red trains humans and agents to ignore the signal" failure
    # mode that `ci-make-green-and-load-bearing` exists to end. The report
    # artifact still uploads below, so the signal stays visible.
    #
    # REVERT (delete this line) when
    # `playwright-e2e-suite-non-deterministic-failures-likely-shared-state-auth-config-gap`
    # lands -- that ticket owns restoring this to a real gate, and its
    # acceptance criteria include flipping this back.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install pyrite into a venv at .venv
        # playwright.config.ts launches the backend via .venv/bin/uvicorn,
        # so the venv path must match that expectation.
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[all]"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Run Playwright e2e tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  # ===========================================================================
  # Smoke: the "breadth" row of ADR-0032 §3a's value chain that had nothing in
  # it. The matrix proves the CODE on three interpreters; nothing proved the
  # ASSEMBLED THING -- a real pyrite-server process driven by a real HTTP and
  # MCP client, and the CLI exactly as docs/getting-started.md documents it.
  # Every bug the outside contributor found (PRs #3, #4, #5) lived in that gap
  # and none of them could have been caught by an in-process TestClient test.
  #
  # Gated on the push to dev (and manual dispatch), NOT on pull_request, and
  # deliberately absent from `gate`'s needs: it costs minutes, and a PR must
  # not wait for it. A break here blocks the RELEASE, and a red dev blocks
  # every PR through the up-to-date rule anyway.
  # ===========================================================================
  smoke:
    needs: changes
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            extensions/*/pyproject.toml

      - name: Install dependencies
        # Same surface as `test`: the smoke layer drives the installed console
        # scripts (pyrite, pyrite-server), so the install has to be the one a
        # user gets, extensions included.
        run: |
          uv pip install --system -e ".[all]"
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              uv pip install --system -e "$ext"
            fi
          done

      - name: Live-process smoke tests (REST, MCP over SSE, MCP over stdio)
        env:
          # Offline: the smoke layer must not download a ~90 MB model. Tests
          # that need one skip themselves when it is not already cached.
          HF_HUB_OFFLINE: "1"
        # -n auto like every other pytest gate: each server fixture binds its
        # own free port under its own temp data dir, so the smoke tests are
        # xdist-safe by construction.
        #
        # --dist loadfile, though, not the default `load`: the server fixtures
        # are module-scoped, and xdist re-runs a module-scoped fixture per
        # worker. Splitting one file across ten workers starts ten servers
        # instead of one and makes the run SLOWER (46 s vs 22 s locally).
        # loadfile keeps each file whole on one worker.
        run: pytest tests/e2e -m e2e -n auto --dist loadfile

      - name: Getting-started tutorial (docs-as-tests)
        run: bash scripts/run_tutorial.sh

  # ===========================================================================
  # verify-red (#352; redesigned in 0.26): do the PR's new and edited tests
  # fail without its change? scripts/verify_red_ci.py checks the merge base
  # out into a throwaway worktree, overlays the PR's test-side files, runs the
  # new tests, overlays the rest of the change and runs them again. The
  # summary line and a table of the tests that are not red go to the run
  # summary; `test-evidence.json` (verdict counts plus the test job's diff
  # coverage) is the measurement for the gating decision.
  #
  # A SIGNAL, NOT A GATE: absent from `gate`'s needs and not a required check;
  # it fails only when the check itself could not run. It waits for `test`
  # (for the diff coverage) but runs whatever `test` concluded.
  # ===========================================================================
  verify-red:
    needs: [changes, test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    # Two pytest runs of at most --timeout each, plus setup.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the PR's base must be in history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            extensions/*/pyproject.toml

      # The tests run in the throwaway tree with it first on PYTHONPATH; the
      # script refuses (#189) if any package there imports from elsewhere.
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[all]"
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then uv pip install --system -e "$ext"; fi
          done

      - name: Fetch the diff coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: diff-cover

      - name: Run the new tests with and without the change
        env:
          HF_HUB_OFFLINE: "1"
        run: >-
          python scripts/verify_red_ci.py --timeout 420
          --base "${{ github.event.pull_request.base.sha }}"
          --pr "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --diff-cover-json diff-cover.json
          --json test-evidence.json

      - name: Keep the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: test-evidence.json
          if-no-files-found: ignore
          retention-days: 90

  # ===========================================================================
  # Experimental (#657): "a red check means the core broke; an experimental
  # feature can be broken without stopping the core, but never silently."
  #
  # Runs the tests tests/experimental_surface.py marks `experimental` (the
  # surfaces kb/designs/alpha-supported-surface.md calls experimental), on
  # every PR that touches the backend and on every push to dev. NOT in
  # `gate`'s needs and not a required check, so it never blocks a merge. It
  # is red only for news: scripts/experimental_ratchet.py fails it on a
  # failure missing from tests/experimental_known_failures.txt, or when a PR
  # grows that file (it can only shrink), and lists in the summary a known
  # failure that now passes. Not in the merge queue: the queue proves the
  # core. One interpreter: breadth is the core's job.
  # ===========================================================================
  experimental:
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true')
      || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reading the open experimental-broken issues tells a failure already
    # filed on dev (not news) from a new one; writing them is the next job's.
    permissions:
      contents: read
      issues: read
    # The Postgres backend is experimental, so its conformance legs run here.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyrite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The base's known-failures file, to check the list only shrank.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            extensions/*/pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[all,postgres]"
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then uv pip install --system -e "$ext"; fi
          done

      # Never fails the job itself: the ratchet below reads the report and
      # pytest's exit status, and decides. xunit1 records each case's file,
      # from which the ratchet rebuilds the node id; a module that fails to
      # import is reported as a failure of that file instead of stopping the
      # run. The step times out before the job does, so the ratchet still
      # runs and reports the run incomplete (no exit status) instead of the
      # job ending cancelled.
      - name: Run the experimental tests
        id: run
        continue-on-error: true
        timeout-minutes: 20
        env:
          PYRITE_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/pyrite_test
          HF_HUB_OFFLINE: "1"
        run: |
          set +e
          pytest -n auto -m "experimental and not slow and not e2e" \
            --continue-on-collection-errors \
            -o junit_family=xunit1 --junitxml=experimental.xml
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # Red only for news: a failure in neither the known-failures list nor
      # an open experimental-broken issue, a grown list, or a run that did
      # not complete (exit 2).
      - name: Compare with the known failures and the open issues
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git show "$BASE_SHA:tests/experimental_known_failures.txt" > /tmp/base-known.txt 2>/dev/null \
            || rm -f /tmp/base-known.txt
          python scripts/experimental_ratchet.py check \
            --junit experimental.xml \
            --run-exit "${{ steps.run.outputs.exit }}" \
            --known tests/experimental_known_failures.txt \
            --base-known /tmp/base-known.txt \
            --open-issues \
            --summary "$GITHUB_STEP_SUMMARY" \
            --result-json experimental-result.json

      - name: Keep the result for issue filing
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: experimental-result
          path: |
            experimental-result.json
            experimental.xml
          if-no-files-found: ignore
          retention-days: 14

  # On a push to dev only, whenever `experimental` did not succeed: a test
  # file with a new failure, a grown known-failures list, or a run that did
  # not complete gets an `experimental-broken` issue (or a comment on the open
  # one) naming the commit and the run. always(), not failure(): a job that
  # hit its timeout ends `cancelled`, and failure() is false for that, so the
  # one run that reported nothing would file nothing. A separate job so that
  # the only grant of issues: write is here, on dev pushes, with the
  # workflow's own token; a pull request's run reports in its job summary and
  # can write nothing.
  experimental-issues:
    needs: experimental
    if: >-
      ${{ always()
      && github.event_name == 'push' && github.ref == 'refs/heads/dev'
      && needs.experimental.result != 'success'
      && needs.experimental.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gh label create / issue create / issue comment.
      issues: write
    steps:
      - uses: actions/checkout@v4

      # No artifact (the job timed out or crashed) is itself the news.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: experimental-result

      - name: File or update experimental-broken issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/experimental_ratchet.py file-issues
          --result-json experimental-result.json
          --job-result "${{ needs.experimental.result }}"
          --sha "$GITHUB_SHA"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # ===========================================================================
  # The one required check. A skipped matrix job reports as `test`, not
  # `test (3.12)`, so requiring the matrix legs by name hangs every docs-only
  # PR (the classifier skipped the matrix, the required context never
  # arrived: PR #36). `gate` needs every gating job, always runs, and fails
  # only when one of them failed or was cancelled -- skipped is a pass, which
  # is what the classifier means by it.
  # ===========================================================================
  gate:
    needs: [changes, kb, test, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any gating job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "a gating job failed or was cancelled"; exit 1
          fi
          echo "gate: all gating jobs succeeded or were skipped"
