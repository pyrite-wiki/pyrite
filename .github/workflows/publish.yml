name: Publish to PyPI

# Manual-only. This used to fire on `release: published`, but the `pyrite`
# name on PyPI is held by a locked pre-2FA account (ADR-0025, amended
# 2026-09-17), so an automatic run can only fail -- and would put a red X on
# every GitHub release. Restore the release trigger once the name is recovered
# or the package is published under a new one.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-pyrite:
    name: Publish pyrite to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  publish-pyrite-mcp:
    name: Publish pyrite-mcp to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    needs: publish-pyrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        working-directory: pyrite-mcp
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: pyrite-mcp/dist/
