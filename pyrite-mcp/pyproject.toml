[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrite-mcp"
version = "0.20.0"
description = "Standalone MCP server for Pyrite knowledge bases"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["mcp", "knowledge-base", "ai", "agent"]

# The git tag, as the main README installs Pyrite: the `pyrite` name on PyPI is
# held by an account we do not control (ADR-0025), so `pyrite>=0.20.0` would
# resolve to someone else's package. PyPI refuses to accept an upload with a
# direct reference, so this package is installed from the tag, not from PyPI
# (tests/test_pyrite_mcp_install.py keeps the tag in step with the README).
dependencies = [
    "pyrite @ git+https://github.com/pyrite-wiki/pyrite@v0.26.0",
]

[project.scripts]
pyrite-mcp = "pyrite_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/pyrite-wiki/pyrite"
Repository = "https://github.com/pyrite-wiki/pyrite"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrite_mcp*"]
