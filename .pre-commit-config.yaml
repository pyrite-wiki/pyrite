# Git hooks for Pyrite
#
#   Install:       pre-commit install      (installs all three hook types below)
#   Run manually:  pre-commit run --all-files
#                  pre-commit run --hook-stage pre-push --all-files
#
# What runs where, and why:
#
#   commit     fast checks only (seconds): ruff, file hygiene, import cycles,
#              KB schema validation. No pytest.
#   commit-msg `fix:` commits must touch tests/.
#   pre-push   core + affected tests (scripts/test-affected), only when the
#              pushed range touches code, and not again on a tree whose run
#              already passed; PYRITE_PUSH_FULL=1 for everything. Experimental
#              tests (#657) are deselected, as in the gating CI job;
#              PYRITE_PUSH_EXPERIMENTAL=1 includes them.
#   CI         the authority. Full suite + everything above, on every push and PR;
#              experimental tests in their own non-blocking job.
#
# The commit stage must stay fast because pre-commit stashes EVERY unstaged edit
# in the working tree while commit hooks run. Several sessions share this tree
# (see CLAUDE.md, "Multi-Session Git Hazard"); a multi-minute commit hook makes
# other sessions' edits disappear for minutes, and one session's untracked RED
# test blocks everyone's commits. tests/test_dev_process_config.py pins this
# layout -- change both together.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # Ruff - fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        stages: [pre-commit]
      # Formatter
      - id: ruff-format
        stages: [pre-commit]

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # `stages` is pinned on every hook: default_stages does not apply to hooks
      # whose upstream manifest declares its own stages, and these fixers list
      # pre-push there. Unpinned, they ran over the entire dev..main range on
      # the v0.24.1 release push and aborted a CI-verified push over two
      # missing newlines in old KB files. Pre-push runs pytest, nothing else.
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=500']
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]

  # Type checking (optional, can be slow)
  # Uncomment to enable:
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-PyYAML]

  # Local hooks. They prefer the repo's .venv but fall back to whatever
  # `python` / `pyrite` is on PATH, so they work from a non-activated shell
  # (agents), a differently named venv, or Windows Git Bash.
  - repo: local
    hooks:
      - id: import-cycle-check
        name: Check for circular imports
        entry: bash -c 'PY=.venv/bin/python; [ -x "$PY" ] || PY=python; exec "$PY" scripts/check_import_cycles.py'
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
      - id: pyrite-schema-validate
        name: Validate KB entries
        entry: bash -c 'P=.venv/bin/pyrite; [ -x "$P" ] || P=pyrite; exec "$P" schema validate --changed'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: pytest-full
        name: pytest core + affected tests (pre-push, code changes only)
        # Runs scripts/test-affected: the core set plus every test that
        # imports what the branch changed, on ${PYRITE_PUSH_WORKERS:-4}
        # workers; the full suite when the branch touches conftest, pytest
        # config, this file or CI. PYRITE_PUSH_FULL=1 (or true/yes; read by the
        # script) forces the full suite.
        # The full suite at every push filled the disk and pushed load past 25
        # on 2026-09-24 with several worktrees pushing (#356); CI on the PR
        # runs everything, so this is feedback, not the gate.
        #
        # Each tree is tested once: a `--run` that passed on a clean tree left
        # a stamp (tree SHA + Python major.minor, under the git common dir),
        # and the script skips here when the PUSHED ref's tree has one that
        # covers the selection -- the worker's own run and this one were the
        # same tests on the same code, about 45 minutes under load
        # (2026-09-25). PYRITE_PUSH_FORCE=1 ignores stamps.
        #
        # Refuse rather than fall back. This used to end `|| PY=python`, and in
        # a worktree created with a bare `git worktree add` (no venv) that
        # resolved to the main checkout's interpreter -- whose editable
        # installs point at the MAIN CHECKOUT. The suite then reported on code
        # the push did not contain: on 2026-09-21 extensions/software-kb gave
        # "15 failed, 270 passed" against a stale main checkout and "285
        # passed" against the worktree's own source, and a contributor PR's
        # push was blocked by 93 errors that were not in the tree being pushed
        # (#210, #242). scripts/new-worktree.sh creates the venv; this says so
        # when it is missing instead of quietly answering the wrong question.
        entry: >-
          bash -c 'PY=.venv/bin/python; if [ ! -x "$PY" ]; then
          echo "no .venv in $PWD -- the suite would run against another
          checkout, so this push is refused. Create one with
          scripts/new-worktree.sh, or run
          uv venv && uv pip install -e \".[all,dev]\"" >&2; exit 1; fi;
          exec "$PY" scripts/test-affected --run -n "${PYRITE_PUSH_WORKERS:-4}"'
        language: system
        pass_filenames: false
        # Matched against the files changed in the pushed range: a docs- or
        # KB-only push skips the suite. CI still runs it. Must cover every
        # code path scripts/test-affected acts on (code and data under
        # pyrite/, extensions/, tests/, scripts/, and the root test config),
        # or a push of only those runs no tests at all. Docs, kb/, root *.md,
        # changelog.d/ and web/ are deliberately left to CI, including the
        # contract tests that read them (README tool table, CONTRIBUTING).
        files: '(\.py$|^(pyrite|extensions|tests|scripts)/|(^|/)(pyproject\.toml|pytest\.ini|setup\.cfg|tox\.ini)$|^kb/kb\.yaml$|^\.pre-commit-config\.yaml$|^\.github/workflows/)'
        stages: [pre-push]
      - id: fix-commit-has-tests
        name: "fix: commits must touch tests/"
        entry: bash -c 'PY=.venv/bin/python; [ -x "$PY" ] || PY=python; exec "$PY" scripts/check_fix_commit_has_tests.py "$1"' --
        language: system
        stages: [commit-msg]
